<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLST - 임상병리학 통합 평가 시스템</title>
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- OMR 답안지 서랍 -->
<div id="omr-drawer" class="omr-drawer" style="display: none;">
    <button id="omr-toggle" class="omr-toggle" onclick="app.toggleOMR()">></button>
    <div class="omr-content">
        <h3>OMR 답안지</h3>
        <div id="omr-grid" class="omr-grid"></div>
        <button class="btn btn-danger" style="margin-top: 25px; padding: 12px; font-size: 1em;" onclick="app.finishExam()">최종 제출하기</button>
    </div>
</div>

<button id="secret-btn" onclick="app.toggleTheme()"></button>

<!-- 원본 이미지 팝업 모달 -->
<div id="image-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; cursor: zoom-out;" onclick="this.style.display='none'">
    <img id="modal-img" style="max-width: 95%; max-height: 95%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8);">
</div>

<div class="container">
    <div id="start-screen">
        <h1 id="main-title">CLST</h1>
        <div class="selector-group">
            <div class="selector-box">
                <label>분류</label>
                <select id="category-select" onchange="app.onCategoryChange()">
                    <option value="ASCPi">ASCPi</option>
                    <option value="내신">내신 (GPA)</option>
                </select>
            </div>
            <div class="selector-box">
                <label>과목</label>
                <select id="subject-select" onchange="app.onSubjectChange()"></select>
            </div>
        </div>
        <div class="settings-box">
            <h3>대시보드</h3>
            <p style="margin-bottom: 10px;"><strong id="display-subject-name">과목</strong> 보유 문항: <strong id="total-db-count">0</strong>개</p>
            <div style="margin-bottom: 0;">
                <label style="font-weight: bold; font-size: 0.9em;">동적 학습률 (완벽 숙지율)</label>
                <div class="lr-bar-container"><div id="learning-rate-bar" class="lr-bar"></div></div>
                <div style="text-align: right; font-size: 0.85em; margin-top: 5px; color: #64748b;"><span id="learning-rate-text">0</span>% (<span id="check-count">0</span> / <span id="total-db-count-lr">0</span>)</div>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn btn-secondary" style="margin-top: 0; flex: 1;" onclick="app.showSearchScreen()">문항 검색</button>
            <button class="btn btn-secondary" style="margin-top: 0; flex: 1;" onclick="app.showBookmarkScreen()">북마크 보관함</button>
        </div>
        <div>
            <hr style="border:0; border-top: 1px solid #cbd5e1; margin-bottom: 15px;">
            <label style="font-weight: bold; font-size: 0.9em;">응시 문항 수:</label>
            <input type="number" id="question-count" value="10" min="1" style="width: 80px; padding: 8px; margin-bottom: 15px; display: inline-block;">
            <button class="btn btn-primary" onclick="app.startQuiz('practice')">연습 모드 (자유 선택/개별 채점)</button>
            <button class="btn btn-danger" onclick="app.startQuiz('exam')">시험 모드 (실전 평가/일괄 채점)</button>
            <button class="btn btn-outline" onclick="app.startReviewMode()">해설 모드 (전체 훑어보기)</button>
            <div style="margin-top: 25px; padding: 20px; border: 2px dashed #10b981; border-radius: 12px; background: #f0fdf4;">
                <h3 style="margin-bottom: 10px; color: #059669;">실전 모의고사</h3>
                <p style="font-size: 0.9em; color: #065f46; margin-bottom: 15px; line-height: 1.5;">학습을 마무리하며 실전 감각을 극대화하세요. (100문항, 150분 권장)</p>
                <div style="display: flex; gap: 10px; flex-direction: column;">
                    <button class="btn btn-primary" style="background: #10b981; border: none; margin-top: 0;" onclick="app.startSimulation('fixed')">모의고사 1회 (Self-Assessment)</button>
                    <button class="btn btn-outline" style="border-color: #10b981; color: #059669; margin-top: 0;" onclick="app.startSimulation('random')">무작위 실전 모의고사 (과목별 비율 반영)</button>
                </div>
            </div>
        </div>
    </div>
    <div id="search-screen" style="display: none;">
        <div class="quiz-header">
            <div class="progress">문항 검색 (현재 과목 전체) - <span id="search-current-page">1</span>페이지</div>
            <button class="btn btn-secondary btn-small" onclick="app.goHome()">돌아가기</button>
        </div>
        <!-- 디바운싱 적용된 검색창 -->
        <input type="text" id="full-search-input" placeholder="키워드를 입력하세요... (2글자 이상)" oninput="app.debounceSearch()" style="margin-bottom: 20px;">
        <div id="full-search-results" class="quiz-grid">
            <div style="color:#64748b; text-align:center; padding:30px; grid-column: 1 / -1;">검색어를 입력하면 전체 문제 정보가 나타납니다.</div>
        </div>
        <div id="search-footer" style="margin-top: 30px; padding-bottom: 20px;">
            <div id="search-pagination-controls" class="pagination"></div>
        </div>
    </div>
    <div id="bookmark-screen" style="display: none;">
        <div class="quiz-header">
            <div class="progress">북마크 보관함</div>
            <button class="btn btn-secondary btn-small" onclick="app.goHome()">돌아가기</button>
        </div>
        <div id="bookmark-folders-container">
            <div class="settings-box" style="text-align: left; padding: 25px;">
                <p style="margin-bottom: 15px; color: #64748b; font-size: 0.95em;">저장된 폴더를 클릭하면 해당 문제들로 연습 모드가 시작됩니다.</p>
                <div id="bookmark-folders-list" class="folder-list">
                    <span style="font-size: 0.9em; color: #94a3b8;">저장된 폴더가 없습니다.</span>
                </div>
            </div>
        </div>
        <!-- 북마크 폴더 내 문항 확인 영역 -->
        <div id="bookmark-view-area" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 id="bookmark-folder-title" style="margin: 0;">폴더명</h3>
                <button class="btn btn-outline btn-small" onclick="app.backToBookmarkFolders()">목록으로</button>
            </div>
            <div id="bookmark-questions-list" class="quiz-grid"></div>
            <div id="bookmark-footer" style="margin-top: 30px; padding-bottom: 20px;">
                <div id="bookmark-pagination-controls" class="pagination"></div>
            </div>
        </div>
    </div>
    <div id="quiz-area" style="display: none;">
        <div class="quiz-header">
            <div class="progress"><span id="mode-badge" style="background:#e2e8f0; padding:4px 8px; border-radius:4px; margin-right:10px; font-size:0.8em;">모드</span> 전체 <span id="total-quiz-num">0</span>문항 중 <span id="current-page-text">1</span>페이지</div>
            <button class="btn btn-secondary btn-small" onclick="app.goHome()">중단하기</button>
        </div>
        <div id="quiz-grid" class="quiz-grid" style="padding-bottom: 10px;"></div>
        
        <!-- 하단 고정 네비게이션 -->
        <div id="quiz-footer">
            <div id="pagination-controls" class="pagination"></div>
            <button id="finish-exam-btn" class="btn btn-danger" style="display: none; width: 60%; margin: 15px auto 0;" onclick="app.finishExam()">시험 종료 및 최종 채점</button>
        </div>
    </div>
    <div id="study-area" style="display: none;">
        <div class="quiz-header">
            <div class="progress">전체 해설 모드 (<span id="study-total-num">0</span>문항) - <span id="study-current-page">1</span>페이지</div>
            <button class="btn btn-secondary btn-small" onclick="app.goHome()">돌아가기</button>
        </div>
        <div id="study-list" class="quiz-grid"></div>
        <!-- 해설 모드 하단 페이지네이션 -->
        <div id="study-footer" style="margin-top: 30px; padding-bottom: 20px;">
            <div id="study-pagination-controls" class="pagination"></div>
        </div>
    </div>
    <!-- 플로팅 돌아가기 버튼 -->
    <button id="fixed-back-btn" class="btn btn-secondary btn-small" style="display: none; position: fixed; top: 15px; right: 15px; width: auto; z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.3);" onclick="app.goHome()">돌아가기</button>
    <div id="result-screen" style="display: none;">
        <h2>시험 결과</h2>
        <div style="text-align: center; padding: 20px; background: #f8fafc; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1;">
            점수: <strong id="correct-count" style="font-size: 2.5em; color: #003876;">0</strong> <span style="font-size: 1.2em; color: #64748b;">/ <span id="result-total-count">0</span></span>
            <div id="score-message" style="margin-top: 10px; font-weight: bold; color: #1e7e34;"></div>
        </div>
        <h3 style="text-align: left; font-size: 1.2em; margin-bottom: 15px; color: #b91c1c;">오답 노트 리뷰</h3>
        <div id="wrong-review-list" class="quiz-grid"></div>
        <button class="btn btn-primary" style="margin-top: 20px;" onclick="app.goHome()">대시보드로 돌아가기</button>
    </div>
</div>

<!-- Custom Scripts -->
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
</body>
</html>
